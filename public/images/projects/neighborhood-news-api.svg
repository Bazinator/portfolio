<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" role="img" aria-labelledby="title desc">
  <title id="title">Neighborhood News API flow</title>
  <desc id="desc">A backend flow from civic data ingestion to PostGIS storage and filtered API responses.</desc>
  <rect width="1400" height="875" fill="#061004"/>
  <circle cx="1160" cy="190" r="250" fill="#70865d" opacity=".22"/>
  <circle cx="230" cy="730" r="280" fill="#ff5546" opacity=".13"/>
  <g transform="translate(132 170)" font-family="Inter, Arial, sans-serif">
    <g fill="#f5f1e8" opacity=".09">
      <rect width="260" height="168"/>
      <rect x="382" width="260" height="168"/>
      <rect x="764" width="260" height="168"/>
      <rect x="382" y="290" width="260" height="168"/>
      <rect x="764" y="290" width="260" height="168"/>
    </g>
    <g fill="#f5f1e8">
      <text x="28" y="58" font-size="24" font-weight="700">Open Data</text>
      <text x="410" y="58" font-size="24" font-weight="700">ETL Job</text>
      <text x="792" y="58" font-size="24" font-weight="700">PostGIS</text>
      <text x="410" y="348" font-size="24" font-weight="700">FastAPI</text>
      <text x="792" y="348" font-size="24" font-weight="700">Local Feed</text>
    </g>
    <g fill="#f5f1e8" opacity=".45" font-size="16">
      <text x="28" y="94">permits / service requests</text>
      <text x="410" y="94">scheduled ingestion</text>
      <text x="792" y="94">events + geometry</text>
      <text x="410" y="384">date, type, neighborhood</text>
      <text x="792" y="384">readable civic context</text>
    </g>
    <g stroke="#ff5546" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M284 84h72"/>
      <path d="M666 84h72"/>
      <path d="M894 186v72"/>
      <path d="M738 374h-70"/>
    </g>
    <g fill="#f4cf63">
      <circle cx="356" cy="84" r="9"/>
      <circle cx="738" cy="84" r="9"/>
      <circle cx="894" cy="258" r="9"/>
      <circle cx="668" cy="374" r="9"/>
    </g>
  </g>
  <text x="132" y="785" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Pipeline Architecture</text>
  <text x="132" y="828" fill="#f5f1e8" fill-opacity=".58" font-family="Inter, Arial, sans-serif" font-size="22">Raw civic records become queryable local events.</text>
</svg>
